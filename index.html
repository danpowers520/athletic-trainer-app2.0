<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .note { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .timestamp { font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
    <h1>Note Taking App</h1>
    <div id="noteHistoryDisplay"></div>
    <input type="text" id="noteInput" placeholder="Add a new note..." />
    <button id="addNoteButton">Add Note</button>

    <script>
        const noteHistory = [];

        function renderNoteHistory() {
            const display = document.getElementById('noteHistoryDisplay');
            display.innerHTML = '';  // Clear current display
            noteHistory.forEach(noteEntry => {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'note';
                noteDiv.innerHTML = `<span class='timestamp'>[${noteEntry.timestamp}]</span> ${noteEntry.note}`;
                display.appendChild(noteDiv);
            });
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            if (input.value) {
                const now = new Date();
                const timestamp = now.toISOString().substr(0, 19).replace('T', ' ');
                noteHistory.push({ note: input.value, timestamp: timestamp });
                input.value = '';  // Clear input
                renderNoteHistory();
            }
        }

        document.getElementById('addNoteButton').addEventListener('click', addNote);
    </script>
</body>
</html>
